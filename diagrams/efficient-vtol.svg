<svg width="100%" viewBox="0 0 680 690" role="img" xmlns="http://www.w3.org/2000/svg"><title>A more efficient tri-tiltrotor VTOL — six annotated changes</title><desc>Top view of a tri-tiltrotor VTOL (two wing tilt-rotors plus a tail rotor) marked with six efficiency changes: larger rotor discs for low disk loading, a higher-aspect low-Reynolds wing, a light LW-PLA and carbon structure, the battery placed forward as ballast to set the centre of gravity, folding the tail rotor in cruise, and flying weight-on-wing while minimizing transition time.</desc><text x="40" y="30" class="th">A more efficient tri-tiltrotor — six changes that pay off</text><text x="40" y="49" class="ts">same layout as your photo · numbers keyed to the notes below</text><rect x="317" y="115" width="46" height="320" rx="23" fill="none" stroke="var(--color-text-primary)" stroke-width="1.6"/><rect x="120" y="248" width="440" height="42" rx="12" fill="none" stroke="var(--color-text-primary)" stroke-width="1.6"/><line x1="140" y1="269" x2="540" y2="269" stroke="var(--color-text-secondary)" stroke-width="1" stroke-dasharray="3 4"/><rect x="180" y="210" width="8" height="42" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3"/><ellipse cx="184" cy="200" rx="58" ry="14" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="184" cy="210" r="7" fill="none" stroke="var(--color-text-primary)" stroke-width="1.4"/><rect x="492" y="210" width="8" height="42" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3"/><ellipse cx="496" cy="200" rx="58" ry="14" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="496" cy="210" r="7" fill="none" stroke="var(--color-text-primary)" stroke-width="1.4"/><rect x="336" y="435" width="8" height="30" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3"/><ellipse cx="340" cy="480" rx="46" ry="12" fill="none" stroke="var(--color-text-primary)" stroke-width="1.3" stroke-dasharray="2 4"/><circle cx="340" cy="470" r="7" fill="none" stroke="var(--color-text-primary)" stroke-width="1.4"/><rect x="330" y="140" width="20" height="34" rx="3" fill="#D9701E" opacity="0.85"/><path d="M340 260 L340 253 A7 7 0 0 1 347 260 Z" fill="var(--color-text-primary)"/><path d="M340 260 L340 267 A7 7 0 0 1 333 260 Z" fill="var(--color-text-primary)"/><circle cx="340" cy="260" r="7" fill="none" stroke="var(--color-text-primary)" stroke-width="1.2"/><text x="351" y="263" class="ts">CG</text><circle cx="184" cy="200" r="12" fill="#D9701E"/><text x="184" y="204" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">1</text><circle cx="430" cy="269" r="12" fill="#D9701E"/><text x="430" y="273" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">2</text><circle cx="340" cy="365" r="12" fill="#D9701E"/><text x="340" y="369" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">3</text><circle cx="340" cy="157" r="12" fill="#D9701E"/><text x="340" y="161" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">4</text><circle cx="340" cy="480" r="12" fill="#D9701E"/><text x="340" y="484" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">5</text><circle cx="250" cy="269" r="12" fill="#D9701E"/><text x="250" y="273" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">6</text><line x1="40" y1="512" x2="640" y2="512" stroke="var(--color-text-secondary)" stroke-width="0.75" opacity="0.5"/><circle cx="49" cy="532" r="9" fill="#D9701E"/><text x="49" y="536" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">1</text><text x="66" y="530" class="ts">Largest rotor discs the airframe allows</text><text x="66" y="545" class="ts">— low disk loading cuts hover power</text><text x="66" y="560" class="ts">roughly 20–25%.</text><circle cx="49" cy="588" r="9" fill="#D9701E"/><text x="49" y="592" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">2</text><text x="66" y="586" class="ts">Higher-aspect wing with a low-Reynolds</text><text x="66" y="601" class="ts">laminar airfoil — the cruise-efficiency</text><text x="66" y="616" class="ts">win that actually scales up from paper.</text><circle cx="49" cy="644" r="9" fill="#D9701E"/><text x="49" y="648" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">3</text><text x="66" y="642" class="ts">LW-PLA shell over a carbon spar — drives</text><text x="66" y="657" class="ts">the airframe mass fraction down; helps</text><text x="66" y="672" class="ts">every phase.</text><circle cx="369" cy="532" r="9" fill="#D9701E"/><text x="369" y="536" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">4</text><text x="386" y="530" class="ts">Battery placed forward as ballast —</text><text x="386" y="545" class="ts">component mass sets the CG, so no dead</text><text x="386" y="560" class="ts">lead and near-zero trim drag.</text><circle cx="369" cy="588" r="9" fill="#D9701E"/><text x="369" y="592" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">5</text><text x="386" y="586" class="ts">Stop and fold the tail rotor in cruise —</text><text x="386" y="601" class="ts">removes its drag once the wing carries</text><text x="386" y="616" class="ts">the weight.</text><circle cx="369" cy="644" r="9" fill="#D9701E"/><text x="369" y="648" text-anchor="middle" class="ts" style="fill:#fff;font-weight:500">6</text><text x="386" y="642" class="ts">Weight-on-wing cruise, and rush the</text><text x="386" y="657" class="ts">hover→cruise transition — minimize time</text><text x="386" y="672" class="ts">in the power-hungry regime.</text></svg>